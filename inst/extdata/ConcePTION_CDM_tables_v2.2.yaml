EUROCAT:
- Variable: centre
  Mandatory: 'Yes'
  Description: CENTRE NUMBER
  Format: Character
  Comments: 'Table reference: EUROCAT/EUROmediCAT.                                               Code
    allocated by Central Registry'
- Variable: numloc
  Mandatory: 'Yes'
  Description: "LOCAL ID \nEach case has a unique identification. This number is a
    maximum of 11 characters long, consisting of either numbers, letters or both.\nID
    numbers should not repeat themselves in different years."
  Format: Character
  Comments: 'Table reference: EUROCAT/EUROmediCAT.                                      Up
    to 11 digits'
- Variable: birthdate
  Mandatory: 'Yes'
  Description: "DATE OF BIRTH \nPlease enter dates as a numeric string, not in date
    format (eg. do not use 28/02/89 or 28-02-89, instead use 280289)."
  Format: Character
  Comments: "Table reference: EUROCAT/EUROmediCAT.                                                                                  Day,
    month, year 99 = Not known for day and month \nDO NOT TRANSMIT RECORDS IF YEAR
    OF BIRTH IS NOT KNOWN"
- Variable: sex
  Mandatory: 'Yes'
  Description: |-
    SEX
    Indicate chromosomal sex, if known, in case of ambiguous genitalia and code malformations in variables 29-44.
    Indicate indeterminate sex in case of ambiguous genitalia with unknown or abnormal sex chromosome complement.
    If sex could not be determined at autopsy due to maceration or other problems, indicate as “not known”.
  Format: Character
  Vocabulary: "1 = Male\n2 = Female\n3 = Indeterminate \n9 = Not known"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: nbrbaby
  Mandatory: 'Yes'
  Description: |-
    NUMBER OF BABIES/FETUSES DELIVERED
    Fill out a separate form for each malformed baby/fetus in a multiple set.
    Only one form to be completed for conjoined twins (Siamese).  The code is “2” for a conjoined twin, unless another baby was delivered at the same time (code “3”).
    Conjoined twins have a specific ICD/BPA code, to be coded under “syndrome” (variable 27).  Give full description of type of conjoined twinning in syndrome text field (variables 28).
    Any other malformations are coded in variables 29-44.
    Notes. If code 8 is used, please specify in variable sp_twin the gestational age at which last known to be a multiple pregnancy and/or first known to be a singleton. The purpose of this coding system is to allow us to distinguish malformed cases which would have civil registration as singleton births from malformed cases which would have civil registration as multiple births. Please specify the sex and outcome (live, still) of the malformed/non-malformed co-twin and zygosity.
  Format: Character
  Vocabulary: "1 = Singleton \n2 = Twins\n3 = Triplets \n4 = Quadruplets \n5 = Quintuplets
    \n6 = Sextuplets or more \n7 = Multiple birth, number of babies not known\n8 =
    Singleton at time of delivery/termination, but known to have been a multiple pregnancy
    at an earlier stage in pregnancy \n9 = Not known"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: sp_twin
  Mandatory: 'No'
  Description: |-
    SPECIFY TWIN TYPE OF BIRTH (malformed and non-malformed),
    like or unlike sex, zygosity
  Format: Character
  Comments: 'Table reference: EUROCAT                                                                       Free
    text'
- Variable: nbrmalf
  Mandatory: 'Yes'
  Description: "NUMBER OF MALFORMED IN MULTIPLE SET\nTo be completed for multiple
    delivery only.\nComplete one form for each malformed baby in a multiple set.  \nRemember
    to give local ID of co-twin in SIB1 field (variable 69) if more than one malformed."
  Format: Character
  Vocabulary: |-
    1 = One
    2 = Two
    3 = Three
    4 = Four
    5 = Five
    6 = Six or more
    9 = Not known
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: type
  Mandatory: 'Yes'
  Description: |-
    TYPE OF BIRTH
    Birth with type of birth not known should be transmitted to EUROCAT, but will be excluded from routine EUROCAT analysis.
    EUROCAT includes all livebirths, fetal deaths with gestational age (GA) ≥20 weeks and terminations of pregnancy (at any gestational age) after prenatal diagnosis of malformation.  Fetal deaths with GA < 20 weeks (code =
    3) may be reported to EUROCAT but will not be included in prevalence data.
    The distinction between stillbirth and spontaneous abortion should follow the definitions in use in your country (to be specified in your Registry Description).  There is usually a lower gestational age limit or birthweight limit for stillbirths.  This varies from country to country.  Below this limit fetal deaths are called spontaneous abortions.
    Terminations of pregnancy refer to cases where prenatal diagnosis was made of malformation in a live fetus and the pregnancy was then terminated.  If the fetus died spontaneously in utero either before or after prenatal diagnosis of malformation then it should be coded as spontaneous abortion or stillbirth, not as termination of pregnancy.  If a termination was performed for other reasons than malformation, the case should not be transmitted to Central Registry.  This means that early terminations where there was no suspicion of malformation before termination should be excluded from the case files.
    Stillbirths or perinatal deaths resulting from termination of pregnancy following prenatal diagnosis must be coded as terminations (value = 4), irrespective of civil registration status.
    For a non-natural fetal reduction in a multiple pregnancy where one fetus is malformed, code 4 (in that case gestlength = gestational age at reduction; date of birth = date of reduction; and code carefully all multiple birth
    variables).
  Format: Character
  Vocabulary: "1 = Live birth \n2 = Stillbirth\n3 = Spontaneous abortion\n4 = Termination
    of Pregnancy\n5 = Not known"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: civreg
  Mandatory: 'Yes'
  Description: |-
    CIVIL REGISTRATION STATUS
    Livebirths and stillbirths are civilly registered leading to either a birth or stillbirth certificate and appear in official birth statistics for your region.
    Code here whether this case fulfilled the conditions for live or stillbirth registration in your country.
  Format: Character
  Vocabulary: "1 = Livebirth\n2 = Stillbirth \n3 = No civil registration\n9 = Not
    known"
  Comments: 'Table reference: EUROCAT'
- Variable: weight
  Mandatory: 'Yes'
  Description: |-
    BIRTH WEIGHT
    Give weight in grams.
  Format: Numeric
  Comments: |-
    Table reference: EUROCAT/EUROmediCAT.                                         9999 = Not known
    (Do not use 99 or 999 for “Not
    Known” as this will be considered the
    birth weight).
- Variable: gestlength
  Mandatory: 'Yes'
  Description: |-
    LENGTH OF GESTATION IN COMPLETED WEEKS
    Give best estimate based on last menstrual period (LMP) and/or ultrasound determination.  If the case is the result of fetal reduction give GA at fetocide.
  Format: Numeric
  Comments: 'Table reference: EUROCAT/EUROmediCAT.                                         99
    = Not known'
- Variable: survival
  Mandatory: 'Yes'
  Description: |-
    SURVIVAL BEYOND ONE WEEK OF AGE
    Yes = Child known to be alive after one week.
    No = Child known to have died before or during first week (including stillbirths and abortions).
    Alive at discharge <1 week refers to cases that are alive at discharge from maternity units before one week of age. Please specify in your Registry Description the day when discharge from maternity units usually takes place.
    If survival at one week is unknown, but survival at discharge from maternity unit less than one week is known, use the latter.
    The definition of first week of life varies between countries. Follow your country’s perinatal mortality definition and specify this in your Registry Description.
    Not known = Not known if child has died during first week.
  Format: Character
  Vocabulary: "1 = Yes\n2 = No\n3 = Alive at discharge <1 week \n9 = Not known"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: death_date
  Mandatory: 'No'
  Description: |-
    DATE OF DEATH
    For livebirths only.
    Please enter dates as a numeric string, not in date format (eg. do not use 28/02/89 or 28-02-89, instead use 280289).
  Format: Character
  Comments: |-
    Table reference: EUROCAT                                                                         Day, month, year 99= Died, not known day or month
    44 =Died, not known year
    Do not use 99 for “not known” year of death, as this will be read as died in 1999, day and month not known.
    222222= Known to be alive at 1 year 333333= Not
    known if alive or dead at 1 year
- Variable: datemo
  Mandatory: 'No'
  Description: |-
    DATE OF BIRTH OF MOTHER
    Give as much information as is known eg. Feb 1963 = 990263, 1963 = 999963.
    Please enter dates as a numeric string, not in date format (eg. do not use 28/02/89 or 28-02-89, instead use 280289).
    This variable can be used to calculate maternal age at Expected Date of Delivery for preterm deliveries and terminations.
  Format: Character
  Comments: |-
    Table reference: EUROCAT                                                                          Day, month, year 99 = Not known day or month
    44 = Not known year
- Variable: agemo
  Mandatory: 'Yes'
  Description: |-
    AGE OF THE MOTHER AT DELIVERY
    In completed years at the time of delivery.  If only the year of birth is available, assume that the mother was born on
    30 June.
  Format: Numeric
  Comments: 'Table reference: EUROCAT/EUROmediCAT.                                          99
    = Not known'
- Variable: bmi
  Mandatory: 'No'
  Description: |-
    MATERNAL BODY MASS INDEX
    Enter BMI (2 digits). The EDMP will also allow entry of maternal height (in centimetres) and weight (in kilograms) and calculate BMI automatically. Values measured at first antenatal visit are preferred, but pre-pregnancy self-reported values may be given. If mother known to be obese, enter code for obesity E660 in maternal illness before pregnancy (variable 60)
    Whilst BMI is a new variable in Guide 1.4 (for cases born from 2013 onwards) if any registry has this information for previous cases, EUROCAT is interested in collecting this information from 2005 onwards
  Format: Numeric
  Comments: |-
    Table reference: EUROCAT/EUROmediCAT.                                            2 digits
    Expected range 15 – 50
    97 = exact BMI NK but <30
    98 = exact BMI NK but >=30
    99 = Not known
- Variable: residmo
  Mandatory: 'No'
  Description: |-
    MOTHER’S RESIDENCE CODE
    Use local code for locality of residence at time of delivery.
  Format: Character
  Comments: 'Table reference: EUROCAT                                                                          Local
    code (up to 10 digits)'
- Variable: totpreg
  Mandatory: 'No'
  Description: |-
    TOTAL NUMBER OF PREVIOUS PREGNANCIES
    NOTE – The current reported pregnancy is NOT included.
    Include all previous abortions whether spontaneous or induced.  Multiple pregnancies count as 1 in the total
  Format: Character
  Vocabulary: "00 = None\n01 = One\n02 = Two\n03 = Three etc \n20 = Twenty or more\n99
    = Not known"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: whendisc
  Mandatory: 'Yes'
  Description: |-
    WHEN DISCOVERED
    When the baby was first suspected to be malformed.
    For prenatal diagnosis: when a major malformation was first suspected (EXCLUDING soft markers).  If prenatal diagnosis is made when fetus is dead code 1 (for stillbirths) or 7 (for spontaneous abortions).
    For livebirths: when first suspicion malformation was at death OR at postmortem, when discovered is age at death (eg. At birth, < 1 week, 1-4 weeks etc).
    For stillbirths: when first suspicion of a malformation was at birth OR at postmortem, when discovered is at birth (eg.
    Code = 1).
    All cases MUST have been confirmed as having a congenital anomaly
    Please also complete variables 12 “SURVIVAL”, 13 “DEATH- DATE”, 19 “CONDISC” and 25 “PM”.
  Format: Character
  Vocabulary: "1 = At birth\n2 = Less than 1 week\n3 = 1-4 weeks\n4 = 1-12 months\n5
    = Over 12 months\n6 = Prenatal diagnosis in live fetus\n7 = At abortion (spontaneous)
    \n9 = Not known \n10 = Postnatal\ndiagnosis, age not\nknown"
  Comments: 'Table reference: EUROCAT/EUROmediCAT.'
- Variable: condisc
  Mandatory: 'No'
  Description: |-
    CONDITION AT DISCOVERY
    Condition of fetus or baby when malformation was first
    suspected.
  Format: Character
  Vocabulary: |-
    1 = Alive
    2 = Dead
    9 = Not known
  Comments: 'Table reference: EUROCAT'
- Variable: agedisc
  Mandatory: 'Yes'
  Description: |-
    IF PRENATALLY DIAGNOSED, GESTATIONAL AGE AT DISCOVERY IN COMPLETED WEEKS
    GA as defined in variable gestlength.
    Gestational age at which the fetus was first suspected to be malformed (EXCLUDING soft markers).  Indicate time of examination rather than time when result known.
    If no prenatal diagnosis please leave blank.
  Format: Numeric
  Comments: 'Table reference: EUROCAT/EUROmediCAT.                                           99
    = Not known'
- Variable: firstpre
  Mandatory: 'No'
  Description: |-
    FIRST POSITIVE PRENATAL TEST
    This refers to the first prenatal test whether screening procedure or diagnostic test which indicated a possible congenital anomaly or need for further tests.
    For code 7 = other specified test, give information in text field (variable 22).
    If test performed and result negative, then the “When discovered” variable cannot be coded 6 (prenatal diagnosis).
    This field is to record what DID happen, not any possible plans or intentions. Ultrasound < 14 weeks means only ultrasound performed which may include a nuchal measurement. The serum/combined screening must involve a biochemical test
  Format: Character
  Vocabulary: "1 = Ultrasound at GA < 14 weeks\n2 = Ultrasound at GA 14-21 weeks \n3
    = Ultrasound at GA ≥ 22 weeks\n4 = Ultrasound GA not known\n5 = Serum/ combined
    screening \n6 = CVS or\namniocentesis \n7 = Other test positive\n8 = Test(s) performed,
    result negative\n9 = Not known \n10 = No test\nperformed"
  Comments: 'Table reference: EUROCAT'
- Variable: sp_firstpre
  Mandatory: 'No'
  Description: |-
    SPECIFY “OTHER” FIRST PRENATAL TEST
    If FIRSTPRE = 7, specify which positive prenatal test
  Format: Character
  Comments: 'Table reference: EUROCAT                                                                          Free
