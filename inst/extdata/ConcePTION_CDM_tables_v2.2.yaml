    enfant nourrisson Fl/200ml\" ('mg/ml' is the concentration unit)"
- Variable: concentration_total_content
  Mandatory: 'No'
  Description: Total content of a single unit such as particular type of pharmaceutical
    unit of presentation or dose form.
  Format: Numeric
  Comments: '*EXAMPLE: "ADVILMED 20 mg/1 ml Susp buv en flacon enfant nourrisson Fl/200ml"
    (''200'' is the unit applying to the total content)'
- Variable: concentration_total_content_unit
  Mandatory: 'No'
  Description: Unit of measure of the concentration total content.
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: '*EXAMPLE: "ADVILMED 20 mg/1 ml Susp buv en flacon enfant nourrisson Fl/200ml"
    (''ml'' is the unit total content where the concentration applies)'
- Variable: medicinal_product_manufacturer
  Mandatory: 'No'
  Description: Name of the manufactured of the pharmaceutical product.
  Format: Character
METADATA:
- Variable: type_of_metadata
  Mandatory: 'Yes'
  Description: There are different types of metadata that are recorded, they may be
    associated with a table or a tble/column, or other
  Format: Character
  Vocabulary: |-
    presence_of_table
    presence_of_column
    list_of_values
    subpopulations
    op_meaning_sets
    op_meanings_list_per_set
    exclude_meaning
- Variable: tablename
  Mandatory: 'Yes'
  Description: Name of the table whose metadata is recorded
  Format: Character
  Vocabulary: names of the tables of the ConcePTION CDM
- Variable: columnname
  Mandatory: 'Yes'
  Description: Name of the column whose metadata is recorded
  Format: Character
  Vocabulary: names of the columns of the ConcePTION CDM
- Variable: other
  Mandatory: 'Yes'
  Description: Other characteristic of the metadata
  Format: Character
- Variable: values
  Mandatory: 'Yes'
  Description: Value of the metadata
  Format: Character
CDM_SOURCE:
- Variable: data_access_provider_code
  Mandatory: 'Yes'
  Description: Code of this DAP organization in the ConcePTION coding system
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: This coding system was first created during the ConcePTION proposal and
    is maintained by WP7
- Variable: data_access_provider_name
  Mandatory: 'Yes'
  Description: Name of the DAP organization
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: This name is standard for ConcePTION partners, serves as reference for
    others
- Variable: data_source_name
  Mandatory: 'Yes'
  Description: Name of the DAP datasource whose subset populates this instance of
    the CDM (if any)
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: 'Some datasources are named after their DAP, others have other names,
    some DAPs access more than one datasources: in all those cases indicate the name
    if deemed useful'
- Variable: data_dictionary_link
  Mandatory: 'No'
  Description: link to a source where the data dictionary of the original data source
    can be found
  Format: Character
  Comments: When the data source description is in the catalogue, this can be populated
    with the link
- Variable: etl_link
  Mandatory: 'No'
  Description: link to a source where the current version of the ETL document of this
    datasurce can be found
  Format: Character
  Comments: When the data dictionary is in the catalogue, this can be populated with
    the link
- Variable: cdm_vocabulary_version
  Mandatory: 'Yes'
  Description: 'version of the ConcePTION CDM this instance conforms to. '
  Format: Character
  Vocabulary: see corresponding vocabulary table
- Variable: cdm_version
  Mandatory: 'Yes'
  Description: 'version of the ConcePTION CDM  vocabularythis instance conforms to. '
  Format: Character
  Vocabulary: see corresponding vocabulary table
- Variable: instance_number
  Mandatory: 'Yes'
  Description: Sequential number of the instances of the CDM that the DAP data_access_provider_code
    has created on date_creation date from the datasource data_source_name it has
    access to
  Format: Integer
  Comments: This is expected to be always 1, but in the rare event when there are
    repeated extractions in one day (with the same date_creation) this may be >1
- Variable: date_creation
  Mandatory: 'Yes'
  Description: date when this CDM instance is populated
  Format: Character yyyymmdd
  Comments: data_access_provider_code, data_source_name, intance_number and date_creation
    uniquely identify an instance of the CDM
- Variable: recommended_end_date
  Mandatory: 'Yes'
  Description: recommended end date for studies using this instance
  Format: Character yyyymmdd
  Comments: Even if data is available to a later date, the DAP's judgement may be
    that data after this date are not complete and should not be analysed
INSTANCE:
- Variable: source_table_name
  Mandatory: 'Yes'
  Description: Table of the local dictionary that is used in ETL
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: names of tables of local data dictionary that are included in the ETL
    procedure
- Variable: source_column_name
  Mandatory: 'Yes'
  Description: Column of the local dictionary that is used in ETL
  Format: Character
  Comments: 'names of columns of the table that are included in the ETL '
- Variable: included_in_instance
  Mandatory: 'Yes'
  Description: Specify whether this column of this table was used to populate this
    specific instance of the CDM
  Format: Character
  Vocabulary: yes/no
- Variable: date_when_data_last_updated
  Mandatory: Yes, if included_in_instance='yes'
  Description: Date when the DAP last received this column
  Format: Character yyyymmdd
  Comments: It is expected to be the same for all the columns of a same table. If
    included_in_instance='no' leave empty.
- Variable: since_when_data_complete
  Mandatory: Yes, if included_in_instance='yes'
  Description: Date since when the DAP considers this column to contain complete data
  Format: Character yyyymmdd
  Comments: It is expected to be the same for all the columns of a same table.  If
    included_in_instance='no' leave empty.
- Variable: up_to_when_data_complete
  Mandatory: Yes, if included_in_instance='yes'
  Description: Date up to when the DAP considers this column to contain complete data
  Format: Character yyyymmdd
  Comments: It is expected to be the same for all the columns of a same table.  If
    included_in_instance='no' leave empty.
- Variable: restriction_in_values
  Mandatory: Yes, if included_in_instance='yes'
  Description: Whether the data uploaded in the CDM were selected based on values
    of this column
  Format: Character
  Vocabulary: yes/no
  Comments: This is mandatory if included_in_instance='yes'.  If included_in_instance='no'
    leave empty.
- Variable: list_of_values
  Mandatory: 'No'
  Description: List of values of this column that are included in this instance of
    the CDM
  Format: Character
  Comments: if restriction_in_values=no, then this must be empty. list of values in
    the vocabulary of this column (possibly with wildcards)
- Variable: restriction_condition
  Mandatory: 'No'
  Description: Condition involving this column that restricted the data uploaded to
    the instance of the CDM
  Format: Character
  Comments: if restriction_in_values=no, then this must be empty
