VISIT_OCCURRENCE:
- Variable: person_id
  Mandatory: 'Yes'
  Description: A foreign key to the person in PERSONS table
  Format: Character
- Variable: visit_occurrence_id
  Mandatory: 'Yes'
  Description: Visit identifier
  Format: Character
- Variable: visit_start_date
  Mandatory: 'Yes'
  Description: Date when the visit starts, or, if it is just a one-day visit, date
    of the visit
  Format: Character yyyymmdd
- Variable: visit_end_date
  Mandatory: 'No'
  Description: Date when the visit ends (only for visits that may last more than one
    day, such as a hospital admission)
  Format: Character yyyymmdd
- Variable: specialty_of_visit
  Mandatory: 'No'
  Description: Specialty of the visit, or if this is a hospital admission, specialty
    of the discharge ward
  Format: Character
  Comments: the vocabulary of this field is the table whose name is included in the
    specialty_of_visit_vocabulary column. Such tables may be record-specific (e.g.
    records from hospitalisations may have one vocabulary, records from specialistic
    visits may have another). Such tables will be available in the Catalogue
- Variable: specialty_of_visit_vocabulary
  Mandatory: 'No'
  Description: Coding system of the specialty
  Format: Character
  Vocabulary: see corresponding vocabulary table
- Variable: status_at_discharge
  Mandatory: 'No'
  Description: outcome of the visit
  Format: Character
  Comments: This captures for instance if the patient died
- Variable: status_at_discharge_vocabulary
  Mandatory: 'No'
  Description: vocabulary of outcome of the visit
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: Contains the coding system used for status_at_discharge.
- Variable: meaning_of_visit
  Mandatory: 'Yes'
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: This field captures and classifies relevant infomation with respect to
    the interpretation of this record. It may capture the prompt, or specificities
    of the content, from the source of this record. A recommended vocabulary is available,
    but ultimately it is open and new values can be freely added if deemed relevant
- Variable: origin_of_visit
  Mandatory: 'Yes'
  Description: name of the source table that originated the record
  Format: Character
  Comments: This column contains the name of the source table for each record.
EVENTS:
- Variable: person_id
  Mandatory: 'Yes'
  Description: A foreign key to the person in PERSONS table who experienced the event
  Format: Character
- Variable: start_date_record
  Mandatory: 'Yes'
  Description: Start date of the visit that lead to the recording of the event code
    or free text
  Format: Character yyyymmdd
- Variable: end_date_record
  Mandatory: 'No'
  Description: End date of the visit that lead to the recording of the event code
    or free text
  Format: Character yyyymmdd
- Variable: event_code
  Mandatory: Yes, unless 'event_free_text' is filled in
  Description: Code characterizing the event according to the vocabulary defined in
    "event_record_vocabulary"
  Format: Character
- Variable: event_record_vocabulary
  Mandatory: 'Yes'
  Description: Vocabulary to which the 'event_code' belongs to; or, if ths record
    contains 'event_free_text' , this column contains the indication 'free_text'
  Format: Character
  Vocabulary: see corresponding vocabulary table
- Variable: text_linked_to_event_code
  Mandatory: 'No'
  Description: If in the original record the code is modified by a text, include this
    text here
  Format: Character
  Comments: Free text
- Variable: event_free_text
  Mandatory: 'No'
  Description: Use this cell if in the record there is no code, just a text
  Format: Character
  Comments: Free text
- Variable: present_on_admission
  Mandatory: 'No'
  Description: Indicates the presence of the event at the start of the visit or hospital
    admission
  Format: Character
  Vocabulary: yes/no
  Comments: if the information is not pertinent or not available, leave empty
- Variable: laterality_of_event
  Mandatory: 'No'
  Description: Laterality of the event
  Format: Character
  Vocabulary: right/left/both
  Comments: If the event is concerning a part of the body, such a leg or an eye, which
    comes with both a right and left version, this can be specified here. If the information
    is not pertinent or not available, leave empty
- Variable: meaning_of_event
  Mandatory: 'Yes'
  Description: This is a ConcePTION classification of the nature of the original record
    associated with this event
  Format: Character
  Vocabulary: see corresponding vocabulary table
  Comments: This field captures and classifies relevant infomation with respect to
    the interpretation of this record. It may capture the prompt, or specificities
    of the content, from the source of this record. A recommended vocabulary is available,
    but ultimately it is open and new values can be freely added if deemed relevant
- Variable: origin_of_event
  Mandatory: 'Yes'
  Description: name of the source table that originated the record
  Format: Character
  Comments: This column contains the name of the source table for each record.
- Variable: visit_occurrence_id
  Mandatory: 'No'
  Description: A foreign key linking this record to the VISIT_OCCURRENCE table
  Format: Character
