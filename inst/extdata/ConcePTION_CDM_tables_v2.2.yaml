- Variable: presyn
  Mandatory: 'No'
  Description: |-
    PRENATAL DIAGNOSIS FOR SYNDROME
    When each anomaly was first diagnosed.
    The basis for this variable is to record whether the prenatal findings strongly suggest the postnatal diagnosis. This variable is not designed for fetal medicine specialists to assess the accuracy of their prenatal diagnosis. Thus the finding of a significant heart anomaly prenatally is considered to be prenatally detected, even if the exact anomaly was not correctly diagnosed. ‘Yes, prenatally diagnosed’, should be used when the prenatal finding is nearly 100% predictive of the congenital anomaly. ‘Partially’ means that the prenatal finding is consistent with the postnatal anomaly but has a lesser predictive value, being suggestive of more than one type of anomaly, an example here would be increased nuchal translucency. The examples below are to illustrate this principle and ensure consistency of coding. Queries about individual cases can be send to Central registry
  Format: Character
  Vocabulary: |-
    1 = Yes, this anomaly was diagnosed prenatally
    2 = No, this anomaly was diagnosed postnatally
    3 = This anomaly partially prenatally diagnosed
    9 =Not known
  Comments: 'Table reference: EUROCAT'
